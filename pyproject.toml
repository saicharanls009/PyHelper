
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhelper"
version = "1.0.0"
description = "A Python utility library containing mathematical, string, security, file and date utilities."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "PyHelper Development Team"}
]

[tool.setuptools.packages.find]
include = ["pyhelper*"]
